name: Check the release

# Nothing is built here: the bundle in dist/ is committed and is what a release
# publishes, so this asks whether it still matches the sources and whether the
# files the Marketplace reads agree with each other. It runs on Forgejo because
# GitHub only ever receives what this repository publishes to it.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Bundle, manifest and README
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    timeout-minutes: 10
    env:
      GITHUB_DISTRIBUTION_REPOSITORY: psym88/ha_alarmo-card-feature
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bundle, hacs.json and the Marketplace link
        run: node scripts/check-release.mjs
