name: Sync to GitHub
run-name: Sync to GitHub ${{ inputs.tag || github.event.release.tag_name || 'only refs' }}

# Forgejo is where this card is written. A published release pushes the branch,
# every tag and the release itself to the public GitHub repository, which is what
# HACS reads. A manual run without a tag only syncs the refs. Releases are never
# deleted on GitHub from here.
on:
  release:
    types:
      - published
      - edited
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Forgejo release tag to publish, empty to only sync refs
        required: false
        type: string

concurrency:
  group: sync-github
  cancel-in-progress: false

jobs:
  sync:
    name: Sync code and release
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    timeout-minutes: 15
    env:
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      FORGEJO_TOKEN: ${{ github.token }}
      FORGEJO_API_URL: ${{ github.api_url }}
      FORGEJO_REPOSITORY: ${{ github.repository }}
      GITHUB_DISTRIBUTION_REPOSITORY: psym88/ha_alarmo-card-feature
      # What the published copy leaves out. The default list in the script keeps
      # the development folder, the tests and the package manager files here; this
      # repository adds its build inputs, because GitHub only ever installs the
      # bundle in dist/.
      PUBLISH_IGNORE: .forgejo .gitea .github test tests scripts .gitignore package.json package-lock.json src tsconfig.json rollup.config.mjs eslint.config.mjs .prettierrc
      BRANCH: main
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push refs and release to GitHub
        run: bash scripts/sync-github.sh
